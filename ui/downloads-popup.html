<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blackout Downloads</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      color: #f4f1ff;
    }
    .downloads-menu {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 12px 14px;
      border-radius: 14px;
      background: #171822;
      border: 1px solid #3b3c4c;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .downloads-menu-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: #9c9bad;
      font-weight: 700;
    }
    .text-link-btn {
      background: transparent;
      border: 0;
      color: #9a7aff;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.12s;
    }
    .text-link-btn:hover {
      color: #bfa8ff;
      text-decoration: underline;
    }
    .downloads-menu-list {
      flex: 1;
      overflow-y: auto;
      max-height: 270px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scrollbar-width: thin;
      padding-right: 2px;
    }
    .downloads-empty-state {
      color: #9c9bad;
      font-size: 12px;
      text-align: center;
      padding: 50px 12px;
      font-style: italic;
    }
    .dl-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .dl-item:hover {
      background: #222332;
      border-color: #38394a;
    }
    .dl-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .dl-item-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .dl-file-icon {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: rgba(154, 122, 255, 0.12);
      color: #9a7aff;
      font-size: 13px;
      flex-shrink: 0;
    }
    .dl-file-icon.completed {
      background: rgba(119, 228, 196, 0.15);
      color: #77e4c4;
    }
    .dl-file-icon.failed {
      background: rgba(255, 104, 77, 0.15);
      color: #ff684d;
    }
    .dl-file-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }
    .dl-filename {
      font-size: 12px;
      font-weight: 600;
      color: #f4f1ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .dl-filename:hover {
      color: #9a7aff;
      text-decoration: underline;
    }
    .dl-status-text {
      font-size: 10px;
      color: #9c9bad;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dl-progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 2px;
    }
    .dl-progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #77e4c4, #9a7aff);
      border-radius: 999px;
      transition: width 0.2s ease;
    }
    .dl-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .dl-action-btn {
      padding: 4px 8px;
      font-size: 10.5px;
      font-weight: 600;
      border-radius: 6px;
      background: #232435;
      border: 1px solid #38394a;
      color: #f4f1ff;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .dl-action-btn:hover {
      background: #2e3046;
      border-color: #9a7aff;
    }
    .downloads-menu-footer {
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .downloads-menu-footer button {
      width: 100%;
      padding: 8px 12px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 8px;
      background: #222332;
      border: 1px solid #38394a;
      color: #f4f1ff;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s ease;
    }
    .downloads-menu-footer button:hover {
      border-color: #77e4c4;
      background: #2a2c3f;
    }
  </style>
<link rel="stylesheet" href="./browser-finish.css"></head>
<body>
  <div class="downloads-menu">
    <div class="downloads-menu-head">
      <span>DOWNLOADS</span>
      <button id="downloads-clear-all" type="button" class="text-link-btn">Clear list</button>
    </div>
    <div id="downloads-menu-list" class="downloads-menu-list">
      <div id="downloads-empty-state" class="downloads-empty-state">No downloads yet</div>
    </div>
    <div class="downloads-menu-footer">
      <button id="menu-open-downloads-folder" type="button">📁 Open Downloads folder</button>
    </div>
  </div>

  <script src="./downloads-popup.js"></script>
</body>
</html>
