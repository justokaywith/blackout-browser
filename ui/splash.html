<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800,height=500">
<title>Blackout Browser</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#090a11;font-family:'Segoe UI',system-ui,sans-serif;color:#f4f1ff;user-select:none;-webkit-app-region:drag}

  /* ── Canvas ──────────────────────────────────────── */
  #stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

  /* ── Atom Container ─────────────────────────────── */
  #atom{position:relative;width:220px;height:220px;transition:transform 1.6s cubic-bezier(.4,0,.2,1),opacity .6s}
  #atom.collapse{transform:scale(.12);opacity:.5}
  #atom.gone{transform:scale(0);opacity:0}

  /* Nucleus */
  #nucleus{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#c4b3ff,#9a7aff 55%,#6a4dcf);box-shadow:0 0 28px 8px rgba(154,122,255,.5);animation:pulse 1.8s ease-in-out infinite}
  #atom.collapse #nucleus{animation:pulse .3s ease-in-out infinite;box-shadow:0 0 42px 18px rgba(154,122,255,.85)}

  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

  /* Orbits */
  .orbit{position:absolute;left:50%;top:50%;border:2px solid rgba(154,122,255,.25);border-radius:50%;transform-origin:center}
  .orbit-1{width:180px;height:70px;margin:-35px 0 0 -90px;animation:spin1 3s linear infinite}
  .orbit-2{width:180px;height:70px;margin:-35px 0 0 -90px;animation:spin2 3.4s linear infinite}
  .orbit-3{width:160px;height:60px;margin:-30px 0 0 -80px;animation:spin3 2.6s linear infinite}

  #atom.collapse .orbit{transition:all 1.4s cubic-bezier(.4,0,.8,1);width:20px!important;height:20px!important;margin:-10px 0 0 -10px!important;border-color:rgba(154,122,255,.6)}

  @keyframes spin1{to{transform:rotate(360deg) rotateX(65deg)}}
  @keyframes spin2{to{transform:rotate(-360deg) rotateX(65deg) rotateZ(60deg)}}
  @keyframes spin3{to{transform:rotate(360deg) rotateX(65deg) rotateZ(-40deg)}}

  /* Electrons */
  .electron{position:absolute;width:10px;height:10px;border-radius:50%;background:#ff684d;box-shadow:0 0 10px 3px rgba(255,104,77,.6);top:-5px;left:50%;margin-left:-5px}
  .electron-2{background:#77e4c4;box-shadow:0 0 10px 3px rgba(119,228,196,.6);top:auto;bottom:-5px}
  .electron-3{background:#f4f1ff;box-shadow:0 0 10px 3px rgba(244,241,255,.5);top:50%;left:-5px;margin-left:0}

  /* ── Flash ──────────────────────────────────────── */
  #flash{position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;background:radial-gradient(circle,#fff,#c4b3ff 40%,transparent 70%);transform:translate(-50%,-50%);opacity:0;pointer-events:none}
  #flash.fire{animation:flash-bang .55s cubic-bezier(.2,0,.3,1) forwards}
  @keyframes flash-bang{0%{width:0;height:0;opacity:1}50%{width:700px;height:700px;opacity:.95}100%{width:900px;height:900px;opacity:0}}

  /* ── Shockwave ──────────────────────────────────── */
  #shockwave{position:absolute;left:50%;top:50%;width:30px;height:30px;border-radius:50%;border:3px solid rgba(154,122,255,.7);transform:translate(-50%,-50%);opacity:0;pointer-events:none}
  #shockwave.fire{animation:wave 1s cubic-bezier(.1,0,.3,1) forwards}
  @keyframes wave{0%{width:30px;height:30px;opacity:.9;border-width:3px}100%{width:650px;height:650px;opacity:0;border-width:1px}}

  /* ── Particles ──────────────────────────────────── */
  .particle{position:absolute;border-radius:50%;pointer-events:none;opacity:0}

  /* ── Remnant ────────────────────────────────────── */
  #remnant{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#2a2740,#191b29 70%);border:2px solid #3d3856;box-shadow:0 0 20px 5px rgba(57,50,86,.6);opacity:0;transform:scale(0);transition:opacity .6s .1s,transform .6s .1s cubic-bezier(.2,0,.3,1)}
  #remnant.show{opacity:1;transform:scale(1)}

  /* ── Logo ────────────────────────────────────────── */
  #logo-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0;transition:opacity .8s .3s}
  #logo-wrap.show{opacity:1}
  #logo-wrap svg{width:72px;height:72px;filter:drop-shadow(0 0 18px rgba(154,122,255,.4))}

  /* ── Welcome Text ────────────────────────────────── */
  #welcome{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .8s .2s}
  #welcome.show{opacity:1}
  #welcome h1{font-size:22px;font-weight:700;letter-spacing:3px;margin-bottom:8px;background:linear-gradient(135deg,#9a7aff,#ff684d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  #welcome .ver{font-size:13px;color:#9c9bad;margin-bottom:6px}
  #welcome .tagline{font-size:14px;color:#9c9bad;font-style:italic}
  #welcome .skip{margin-top:18px;font-size:12px;color:#6b6a7a;cursor:pointer;-webkit-app-region:no-drag}
  #welcome .skip:hover{color:#9a7aff}

  /* ── Fade-out ────────────────────────────────────── */
  #stage.fade-out{animation:fade-out .6s ease forwards}
  @keyframes fade-out{to{opacity:0}}
</style>
</head>
<body>
<div id="stage">
  <!-- Atom -->
  <div id="atom">
    <div class="orbit orbit-1"><div class="electron"></div></div>
    <div class="orbit orbit-2"><div class="electron electron-2"></div></div>
    <div class="orbit orbit-3"><div class="electron electron-3"></div></div>
    <div id="nucleus"></div>
  </div>

  <!-- Explosion effects -->
  <div id="flash"></div>
  <div id="shockwave"></div>

  <!-- Remnant dot -->
  <div id="remnant"></div>

  <!-- Logo (appears after remnant) -->
  <div id="logo-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
      <defs>
        <linearGradient id="orbit-g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#bca7ff"/>
          <stop offset=".62" stop-color="#706b91"/>
          <stop offset="1" stop-color="#323648"/>
        </linearGradient>
        <linearGradient id="escape-g" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#8f73ff"/>
          <stop offset="1" stop-color="#ff684d"/>
        </linearGradient>
      </defs>
      <rect width="256" height="256" rx="72" fill="#10121e"/>
      <g fill="none" stroke="url(#orbit-g)" stroke-width="7" stroke-linecap="round" opacity=".9">
        <ellipse cx="128" cy="128" rx="81" ry="35" transform="rotate(-31 128 128)"/>
        <ellipse cx="128" cy="128" rx="81" ry="35" transform="rotate(31 128 128)"/>
      </g>
      <path d="M164 83c15-15 28-25 43-32" fill="none" stroke="url(#escape-g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="9 11"/>
      <circle cx="128" cy="128" r="18" fill="#191b29" stroke="#827a9e" stroke-width="5"/>
      <circle cx="218" cy="44" r="12" fill="#ff684d"/>
      <circle cx="218" cy="44" r="4" fill="#ffe0b9"/>
    </svg>
  </div>

  <!-- Welcome text -->
  <div id="welcome">
    <h1>BLACKOUT BROWSER</h1>
    <div class="tagline">Your browser, on your terms.</div>
    <div class="skip" id="skip-btn">Click anywhere to launch</div>
  </div>
</div>

<!-- Particle template (spawned by JS) -->
<script>
(function () {
  'use strict';

  const stage   = document.getElementById('stage');
  const atom    = document.getElementById('atom');
  const flash   = document.getElementById('flash');
  const shock   = document.getElementById('shockwave');
  const remnant = document.getElementById('remnant');
  const logo    = document.getElementById('logo-wrap');
  const welcome = document.getElementById('welcome');

  const COLORS = ['#9a7aff', '#ff684d', '#77e4c4', '#f4f1ff', '#bca7ff', '#ffe0b9'];

  let finished = false;

  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ── Particle explosion ──────────────────────────────────────
  function spawnParticles(count) {
    const cx = stage.offsetWidth  / 2;
    const cy = stage.offsetHeight / 2;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'particle';
      const size = 2 + Math.random() * 5;
      const angle = Math.random() * Math.PI * 2;
      const dist  = 80 + Math.random() * 260;
      const dur   = 0.5 + Math.random() * 0.8;
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];

      el.style.cssText = `
        width:${size}px;height:${size}px;
        background:${color};
        left:${cx}px;top:${cy}px;
        box-shadow:0 0 ${size*2}px ${color};
        opacity:1;
        transition:transform ${dur}s cubic-bezier(.15,0,.4,1),opacity ${dur}s ease-out;
      `;
      stage.appendChild(el);

      // Force reflow then animate
      el.getBoundingClientRect();
      el.style.transform = `translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px) scale(0.2)`;
      el.style.opacity = '0';

      setTimeout(() => el.remove(), dur * 1000 + 100);
    }
  }

  // ── Timeline ────────────────────────────────────────────────
  async function runAnimation() {
    // Phase 1: Atom alive (0–3s) — runs via CSS animations already
    await wait(3000);
    if (finished) return;

    // Phase 2: Collapse (3–5s)
    atom.classList.add('collapse');
    await wait(1800);
    if (finished) return;

    // Phase 3: Explosion (5–6s)
    atom.classList.add('gone');
    flash.classList.add('fire');
    shock.classList.add('fire');
    spawnParticles(60);
    await wait(1000);
    if (finished) return;

    // Phase 4: Remnant + Logo (6–7s)
    remnant.classList.add('show');
    await wait(600);
    if (finished) return;
    logo.classList.add('show');
    await wait(600);
    if (finished) return;

    // Phase 5: Welcome text (7–9s)
    welcome.classList.add('show');
    await wait(2500);
    if (finished) return;

    // Auto-dismiss
    dismiss();
  }

  function dismiss() {
    if (finished) return;
    finished = true;
    stage.classList.add('fade-out');
    // Signal Electron to close the splash and launch the browser
    if (window.__blackout_splash && typeof window.__blackout_splash.done === 'function') {
      window.__blackout_splash.done();
    } else if (typeof window.__blackout_splash_done === 'function') {
      window.__blackout_splash_done();
    }
  }

  // Click or key to skip
  document.addEventListener('click', dismiss);
  document.addEventListener('keydown', dismiss);

  runAnimation();
})();
</script>
</body>
</html>
