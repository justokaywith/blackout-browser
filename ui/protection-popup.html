<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blackout Protection & Wavelength</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f4f1ff;
    }
    .menu {
      width: 100%;
      height: 100%;
      padding: 10px;
      border: 1px solid #3b3c4c;
      border-radius: 14px;
      background: #171822;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 9.5px;
      letter-spacing: 0.14em;
      color: #9c9bad;
      font-weight: 700;
    }
    .head small {
      color: #77e4c4;
      font-size: 9px;
      letter-spacing: 0;
    }
    .item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      color: inherit;
    }
    .item:hover {
      background: #232435;
      border-color: #38394a;
    }
    .item.active {
      background: #25263a;
      border-color: #9a7aff;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }
    .dot-light { background: #77e4c4; box-shadow: 0 0 10px #77e4c4; }
    .dot-balanced { background: #9a7aff; box-shadow: 0 0 10px #9a7aff; }
    .dot-extra { background: #ff684d; box-shadow: 0 0 10px #ff684d; }
    .meta b {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #f4f1ff;
    }
    .meta b small {
      font-size: 9.5px;
      font-weight: 500;
      color: #9c9bad;
    }
    .meta p {
      margin: 3px 0 0;
      font-size: 10.5px;
      color: #9c9bad;
      line-height: 1.4;
    }
  </style>
<link rel="stylesheet" href="./browser-finish.css"></head>
<body>
  <div class="menu">
    <div class="head">
      <span>PROTECTION &amp; WAVELENGTH</span>
      <small id="status-tag">Shield Active</small>
    </div>
    <button type="button" class="item" data-mode="light">
      <i class="dot dot-light"></i>
      <div class="meta">
        <b>Light <small>Aurora Teal</small></b>
        <p>Standard browsing · Full compatibility</p>
      </div>
    </button>
    <button type="button" class="item" data-mode="balanced">
      <i class="dot dot-balanced"></i>
      <div class="meta">
        <b>Balanced <small>Eclipse Violet</small></b>
        <p>Secure browsing · YouTube &amp; web ad block</p>
      </div>
    </button>
    <button type="button" class="item" data-mode="extra">
      <i class="dot dot-extra"></i>
      <div class="meta">
        <b>Extra <small>Ember Flame</small></b>
        <p>Hardened security · No tracking · Retains logins</p>
      </div>
    </button>
  </div>

  <script src="protection-popup.js"></script>
</body>
</html>
